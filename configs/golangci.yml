# Engineering-owned golangci-lint configuration.
#
# Consumed by Go repositories that have no npm path. Fetch this file at a
# pinned tag rather than copying it; see practices/go.md.
#
# Enables the checks that `go vet` alone does not cover, without enabling
# opinionated style linters that fight `gofmt`.

version: '2'

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck # unchecked errors — ENG-INT-001
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose # leaked HTTP response bodies
    - errorlint # %w chains and errors.Is/As misuse — ENG-INT-001
    - nilerr # returning nil after a non-nil error
    - rowserrcheck
    - misspell

  settings:
    errcheck:
      check-type-assertions: true
      # check-blank stays false deliberately. errcheck only reports a blank
      # assignment when the right-hand side is a call expression, so `_ = f()`
      # is flagged while `err := f(); _ = err` is not — enabling it mandates a
      # two-line spelling rather than preventing the discard. It also
      # contradicts practices/go.md, which permits `_` when the reason is
      # stated in a comment beside it. The comment requirement is carried by
      # review; a tool that can be satisfied by renaming does not carry it.
      check-blank: false
    staticcheck:
      checks:
        - all

  exclusions:
    presets:
      - std-error-handling
    rules:
      # Test helpers legitimately ignore cleanup errors.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
