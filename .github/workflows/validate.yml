name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  line-endings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require LF in tracked text files
        shell: bash
        run: |
          files="$(git grep -Il $'\r' HEAD -- . || true)"
          if [[ -n "$files" ]]; then
            printf 'Tracked text files contain CR bytes:\n%s\n' "$files"
            exit 1
          fi
      - name: Validate principle metadata
        shell: pwsh
        run: pwsh -File .github/scripts/validate-principles.ps1
      - name: Reject invalid principle metadata
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP ([Guid]::NewGuid())
          $missing = Join-Path $fixture "missing"
          $duplicate = Join-Path $fixture "duplicate"
          $ratified = Join-Path $fixture "ratified"
          $invalidLegacy = Join-Path $fixture "invalid-legacy"
          $declarative = Join-Path $fixture "declarative"
          $invalidOwner = Join-Path $fixture "invalid-owner"
          $missingHandoff = Join-Path $fixture "missing-handoff"
          $invalidNamespace = Join-Path $fixture "invalid-namespace"
          $invalidCase = Join-Path $fixture "invalid-case"
          $unrecognizedPath = Join-Path $fixture "unrecognized-path"
          $invalidHandoff = Join-Path $fixture "invalid-handoff"
          $invalidCatalog = Join-Path $fixture "invalid-catalog"
          $knownPathFixtures = @(
            $missing,
            $duplicate,
            $ratified,
            $invalidLegacy,
            $declarative,
            $invalidOwner,
            $missingHandoff,
            $invalidNamespace,
            $invalidCase,
            $invalidHandoff
          )
          New-Item -ItemType Directory -Path ($knownPathFixtures + $unrecognizedPath + $invalidCatalog) | Out-Null
          foreach ($root in $knownPathFixtures) {
            New-Item -ItemType Directory -Path (Join-Path $root "assurance") | Out-Null
          }

          @(
            "# Missing-field fixture"
            "- ID: ENG-TEST-001"
            "- Status: Draft"
            "- Statement: Require complete metadata."
            "- Rationale: Incomplete rules cannot be reviewed."
            "- Owner and ratification: Engineering owns this Draft's metadata mechanism; only the repository owner may change it to Ratified."
            "- Handoff: Product owns outcome obligations."
            "- Legacy inputs: none"
          ) | Set-Content -Encoding utf8 (Join-Path $missing "assurance/testing.md")
          & pwsh -File .github/scripts/validate-principles.ps1 -Root $missing
          if ($LASTEXITCODE -eq 0) {
            throw "Validator accepted missing principle metadata"
          }

          @(
              "# Duplicate-ID fixture"
              "## First"
              "- ID: ENG-TEST-001"
              "- Status: Draft"
              "- Statement: Keep IDs unique."
              "- Rationale: Stable references require unique identifiers."
              "- Evidence: Validation succeeds."
              "- Owner and ratification: Engineering owns this Draft's identifier mechanism; only the repository owner may change it to Ratified."
              "- Handoff: Product owns outcome obligations."
              "- Legacy inputs: none"
              "## Second"
              "- ID: ENG-TEST-001"
              "- Status: Draft"
              "- Statement: Keep IDs unique."
              "- Rationale: Stable references require unique identifiers."
              "- Evidence: Validation succeeds."
              "- Owner and ratification: Engineering owns this Draft's identifier mechanism; only the repository owner may change it to Ratified."
              "- Handoff: Product owns outcome obligations."
              "- Legacy inputs: none"
          ) | Set-Content -Encoding utf8 (Join-Path $duplicate "assurance/testing.md")
          & pwsh -File .github/scripts/validate-principles.ps1 -Root $duplicate
          if ($LASTEXITCODE -eq 0) {
            throw "Validator accepted duplicate principle IDs"
          }

          @(
            "# Ratified fixture"
            "- ID: ENG-TEST-002"
            "- Status: Ratified"
            "- Statement: Keep proposals Draft."
            "- Rationale: Only the owner may ratify."
            "- Evidence: Validation succeeds."
            "- Owner and ratification: Engineering owns this Draft's status mechanism; only the repository owner may change it to Ratified."
            "- Handoff: Product owns outcome obligations."
            "- Legacy inputs: none"
          ) | Set-Content -Encoding utf8 (Join-Path $ratified "assurance/testing.md")
          & pwsh -File .github/scripts/validate-principles.ps1 -Root $ratified
          if ($LASTEXITCODE -eq 0) {
            throw "Validator accepted a non-Draft principle"
          }

          @(
            "# Invalid legacy fixture"
            "- ID: ENG-TEST-003"
            "- Status: Draft"
            "- Statement: Require exact legacy IDs."
            "- Rationale: Nested headings are not independently addressable."
            "- Evidence: Validation succeeds."
            "- Owner and ratification: Engineering owns this Draft's legacy-reference mechanism; only the repository owner may change it to Ratified."
            "- Handoff: Product owns outcome obligations."
            "- Legacy inputs: ``studio-legacy:security:7.1``"
          ) | Set-Content -Encoding utf8 (Join-Path $invalidLegacy "assurance/testing.md")
          & pwsh -File .github/scripts/validate-principles.ps1 -Root $invalidLegacy
          if ($LASTEXITCODE -eq 0) {
            throw "Validator accepted an invalid legacy ID"
          }

          @(
            "# Declarative-statement fixture"
            "- ID: ENG-TEST-004"
            "- Status: Draft"
            "- Statement: Tests are required."
            "- Rationale: Principles must direct an observable action."
            "- Evidence: Validation rejects declarative statements."
            "- Owner and ratification: Engineering owns this Draft's test mechanism; only the repository owner may change it to Ratified."
            "- Handoff: Product owns outcome obligations."
            "- Legacy inputs: none"
          ) | Set-Content -Encoding utf8 (Join-Path $declarative "assurance/testing.md")
          & pwsh -File .github/scripts/validate-principles.ps1 -Root $declarative
          if ($LASTEXITCODE -eq 0) {
            throw "Validator accepted a declarative principle statement"
          }

          @(
            "# Invalid-owner fixture"
            "- ID: ENG-TEST-005"
            "- Status: Draft"
            "- Statement: Require owner-only Ratification."
            "- Rationale: Agents may propose but cannot ratify principles."
            "- Evidence: Validation rejects delegated Ratification."
            "- Owner and ratification: Engineering may ratify this Draft."
            "- Handoff: Product owns outcome obligations."
            "- Legacy inputs: none"
          ) | Set-Content -Encoding utf8 (Join-Path $invalidOwner "assurance/testing.md")
          & pwsh -File .github/scripts/validate-principles.ps1 -Root $invalidOwner
          if ($LASTEXITCODE -eq 0) {
            throw "Validator accepted invalid Ratification authority"
          }

          @(
            "# Missing-handoff fixture"
            "- ID: ENG-TEST-006"
            "- Status: Draft"
            "- Statement: Require an external authority reference."
            "- Rationale: Engineering must not absorb another authority's policy."
            "- Evidence: Validation rejects an absent authority handoff."
            "- Owner and ratification: Engineering owns this Draft's handoff mechanism; only the repository owner may change it to Ratified."
            "- Handoff: none"
            "- Legacy inputs: none"
          ) | Set-Content -Encoding utf8 (Join-Path $missingHandoff "assurance/testing.md")
          & pwsh -File .github/scripts/validate-principles.ps1 -Root $missingHandoff
          if ($LASTEXITCODE -eq 0) {
            throw "Validator accepted a missing authority handoff"
          }

          @(
            "# Invalid-namespace fixture"
            "- ID: ENG-TEST-007"
            "- Status: Draft"
            "- Statement: Keep IDs in their file namespace."
            "- Rationale: Stable families make principle references resolvable."
            "- Evidence: Validation rejects a mismatched file namespace."
            "- Owner and ratification: Engineering owns this Draft's identifier mechanism; only the repository owner may change it to Ratified."
            "- Handoff: ``jrmoulckers/.github`` owns automation."
            "- Legacy inputs: none"
          ) | Set-Content -Encoding utf8 (Join-Path $invalidNamespace "assurance/security-and-privacy.md")
          & pwsh -File .github/scripts/validate-principles.ps1 -Root $invalidNamespace
          if ($LASTEXITCODE -eq 0) {
            throw "Validator accepted an ID outside its file namespace"
          }

          @(
            "# Invalid-case fixture"
            "- ID: eng-TEST-008"
            "- Status: Draft"
            "- Statement: Keep metadata case exact."
            "- Rationale: Stable references require canonical casing."
            "- Evidence: Validation rejects incorrectly cased metadata."
            "- Owner and ratification: Engineering owns this Draft's metadata mechanism; only the repository owner may change it to Ratified."
            "- Handoff: Product owns outcome obligations."
            "- Legacy inputs: none"
          ) | Set-Content -Encoding utf8 (Join-Path $invalidCase "assurance/testing.md")
          & pwsh -File .github/scripts/validate-principles.ps1 -Root $invalidCase
          if ($LASTEXITCODE -eq 0) {
            throw "Validator accepted incorrectly cased metadata"
          }

          @(
            "# Unrecognized-path fixture"
            "- ID: ENG-TEST-009"
            "- Status: Draft"
            "- Statement: Keep principle paths registered."
            "- Rationale: File placement determines stable identifier families."
            "- Evidence: Validation rejects unregistered principle files."
            "- Owner and ratification: Engineering owns this Draft's path mechanism; only the repository owner may change it to Ratified."
            "- Handoff: Product owns outcome obligations."
            "- Legacy inputs: none"
          ) | Set-Content -Encoding utf8 (Join-Path $unrecognizedPath "unmapped.md")
          & pwsh -File .github/scripts/validate-principles.ps1 -Root $unrecognizedPath
          if ($LASTEXITCODE -eq 0) {
            throw "Validator accepted an unrecognized principle path"
          }

          @(
            "# Invalid-handoff fixture"
            "- ID: ENG-TEST-010"
            "- Status: Draft"
            "- Statement: Preserve external authority."
            "- Rationale: Mentioning another authority does not assign its ownership."
            "- Evidence: Validation rejects a collision disguised as a handoff."
            "- Owner and ratification: Engineering owns this Draft's handoff mechanism; only the repository owner may change it to Ratified."
            "- Handoff: Engineering owns Product metrics; Product owns outcome obligations."
            "- Legacy inputs: none"
          ) | Set-Content -Encoding utf8 (Join-Path $invalidHandoff "assurance/testing.md")
          & pwsh -File .github/scripts/validate-principles.ps1 -Root $invalidHandoff
          if ($LASTEXITCODE -eq 0) {
            throw "Validator accepted a malformed authority handoff"
          }

          Copy-Item -Path (Join-Path "principles" "*") -Destination $invalidCatalog -Recurse
          $invalidCatalogFile = Join-Path $invalidCatalog "assurance/testing.md"
          $invalidCatalogContent = Get-Content -LiteralPath $invalidCatalogFile -Raw
          $invalidCatalogContent.Replace(
            "ENG-TEST-010",
            "ENG-TEST-999"
          ) | Set-Content -LiteralPath $invalidCatalogFile -Encoding utf8 -NoNewline
          & pwsh -File .github/scripts/validate-principles.ps1 -Root $invalidCatalog -RequireCatalog
          if ($LASTEXITCODE -eq 0) {
            throw "Validator accepted an incomplete or unexpected principle catalog"
          }
          Remove-Item -Recurse -Force $fixture
          $global:LASTEXITCODE = 0
