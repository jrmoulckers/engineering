name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  line-endings:
    runs-on: ubuntu-latest
    env:
      BASELINE_REF: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require LF in tracked text files
        shell: bash
        run: |
          files="$(git grep -Il $'\r' HEAD -- . || true)"
          if [[ -n "$files" ]]; then
            printf 'Tracked text files contain CR bytes:\n%s\n' "$files"
            exit 1
          fi
      - name: Validate principle metadata
        shell: pwsh
        run: |
          if ($env:BASELINE_REF) {
            pwsh -File .github/scripts/validate-principles.ps1 `
              -BaselineRef $env:BASELINE_REF
          }
          else {
            pwsh -File .github/scripts/validate-principles.ps1
          }
      - name: Reject invalid principle metadata
        shell: pwsh
        run: pwsh -File .github/scripts/test-validate-principles.ps1

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - name: Check formatting with this repository's own Prettier config
        run: npm run format:check
      - name: Verify the principle index matches the principle files
        run: npm run principles:check
      - name: Check that no principle silently loses its implementing guide
        run: npm run coverage:check
      - name: Test shared configuration packages
        run: npm test

  # The eslint-config peer range claims `eslint: ^9.0.0 || ^10.0.0`, but the
  # repository's own devDependency pins one major, so half that claim was
  # asserted and never exercised. A consumer running ESLint 10 found this
  # before CI did. The matrix runs the smoke suite — the only tests that load
  # the presets into a real ESLint — against both supported majors.
  eslint-majors:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        eslint: ['9', '10']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: npm install --no-save eslint@${{ matrix.eslint }}
      - name: Confirm the requested major is the one actually installed
        shell: bash
        run: |
          # Without this the matrix can silently run the same major twice —
          # a peer conflict or a failed install would leave the pinned
          # version in place and both legs would pass while testing one.
          actual="$(node -p "require('eslint/package.json').version")"
          echo "eslint $actual"
          case "$actual" in
            ${{ matrix.eslint }}.*) ;;
            *) echo "expected eslint ${{ matrix.eslint }}.x, got $actual" >&2; exit 1 ;;
          esac
      - name: Load the presets into this ESLint major and lint real files
        run: node --test packages/eslint-config/test/smoke.test.mjs
