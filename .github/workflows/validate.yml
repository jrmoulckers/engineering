name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  line-endings:
    runs-on: ubuntu-latest
    env:
      BASELINE_REF: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Require LF in tracked text files
        shell: bash
        run: |
          files="$(git grep -Il $'\r' HEAD -- . || true)"
          if [[ -n "$files" ]]; then
            printf 'Tracked text files contain CR bytes:\n%s\n' "$files"
            exit 1
          fi
      - name: Validate principle metadata
        shell: pwsh
        run: |
          if ($env:BASELINE_REF) {
            pwsh -File .github/scripts/validate-principles.ps1 `
              -BaselineRef $env:BASELINE_REF
          }
          else {
            pwsh -File .github/scripts/validate-principles.ps1
          }
      - name: Reject invalid principle metadata
        shell: pwsh
        run: pwsh -File .github/scripts/test-validate-principles.ps1

  # Merging is not shipping: publish.yml runs on a tag, so a merge to main
  # reaches no consumer until one is pushed. That was missed for 30 consecutive
  # commits while each fix was reported to seven repositories as shipped. Needs
  # full history and tags, hence its own checkout.
  release-lag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Fail on package changes that no tag could publish
        run: node scripts/check-release-lag.mjs

  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reading this repository's own published packages, to confirm versions.json still
      # matches the registry. Consumers read that file when they cannot query the registry
      # themselves, so it going stale silently is the failure being prevented.
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # `npm test` covers `versions:print --tag`, which resolves a repo tag to
          # the package versions it ships. The default shallow checkout carries no
          # tags, and those tests refuse loudly rather than passing vacuously — so
          # the history has to be here.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - name: Check formatting with this repository's own Prettier config
        run: npm run format:check
      - name: Verify the principle index matches the principle files
        run: npm run principles:check
      - name: Check that no principle silently loses its implementing guide
        run: npm run coverage:check
      - name: Verify published versions match what this repository advertises
        run: npm run versions:check
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Test shared configuration packages
        run: npm test

  # The eslint-config peer range claims `eslint: ^9.0.0 || ^10.0.0`, but the
  # repository's own devDependency pins one major, so half that claim was
  # asserted and never exercised. A consumer running ESLint 10 found this
  # before CI did. The matrix runs the smoke suite — the only tests that load
  # the presets into a real ESLint — against both supported majors.
  eslint-majors:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        eslint: ['9', '10']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      # --legacy-peer-deps because this repository's dev tree carries
      # eslint-plugin-react and eslint-plugin-jsx-a11y for the framework preset
      # tests, and both cap their eslint peer at 9 — a dev-tree artifact, not
      # anything a consumer sees. Skipping peer resolution is only safe because
      # the assertion below verifies which versions actually landed.
      - run: npm install --no-save --legacy-peer-deps eslint@${{ matrix.eslint }} @eslint/js@${{ matrix.eslint }}
      - name: Confirm the requested major is the one actually installed
        shell: bash
        run: |
          # Without this the matrix can silently run the same major twice —
          # a peer conflict or a failed install would leave the pinned
          # version in place and both legs would pass while testing one.
          #
          # @eslint/js is checked too, and installed above, because its major
          # tracks eslint's: @eslint/js@10 peer-requires eslint@^10. It is our
          # dependency rather than the consumer's, so before it was widened a
          # consumer on eslint 10 silently received the eslint 9 recommended
          # rule set. This leg passed the whole time, because CI reproduced
          # that same wrong pairing.
          for pkg in eslint @eslint/js; do
            actual="$(node -p "require('$pkg/package.json').version")"
            echo "$pkg $actual"
            case "$actual" in
              ${{ matrix.eslint }}.*) ;;
              *) echo "expected $pkg ${{ matrix.eslint }}.x, got $actual" >&2; exit 1 ;;
            esac
          done
      - name: Load the presets into this ESLint major and lint real files
        run: node --test packages/eslint-config/test/smoke.test.mjs
