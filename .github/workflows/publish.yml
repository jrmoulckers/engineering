name: Publish packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@jrmoulckers'
      - run: npm ci --ignore-scripts
      - name: Verify the principle index matches the principle files
        run: npm run principles:check
      - name: Test shared configuration packages
        run: npm test
      - name: Publish every changed package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for dir in packages/*/; do
            name="$(node -p "require('./${dir}package.json').name")"
            version="$(node -p "require('./${dir}package.json').version")"
            if npm view "${name}@${version}" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
              echo "skip ${name}@${version} (already published)"
              continue
            fi
            echo "publishing ${name}@${version}"
            npm publish --workspace "${name}"
          done

  # Every tag gets a GitHub Release, so `releases/latest` resolves. This is
  # not cosmetic: docs/adopting.md sends consumers to find the newest ref, and
  # a Releases page that is empty — or worse, stale because only some tags got
  # one — is how a consumer ends up pinned many versions behind without any
  # signal. A confidently wrong "latest" is worse than none, so this is
  # automated rather than left to whoever cuts the tag.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Create or update the release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          # The previous tag in version order. A lexical sort is wrong here for
          # the same reason it is wrong for consumers: v0.9.0 sorts above
          # v0.11.0. Empty when this is the first tag.
          PREV="$(git tag --list 'v*' --sort=-v:refname \
            | awk -v t="$TAG" 'p==1{print;exit} $0==t{p=1}')"

          # Non-npm consumers (Go config, practices, principles) cannot tell
          # from a package-version list whether anything they fetch changed.
          # Measured on this repository: across 29 tags, configs/golangci.yml
          # changed 3 times. A consumer without this line either re-pins 29
          # times or misses the 3 that mattered — and one who stays current has
          # no signal that enforcement changed under them.
          ARTIFACTS=""
          if [ -n "$PREV" ]; then
            ARTIFACTS="$(git diff --name-only "$PREV..$TAG" \
              -- configs/ practices/ principles/ || true)"
          fi

          {
            echo "Shared configuration and practice for jrmoulckers repositories."
            echo
            echo "Package versions at this tag:"
            echo
            for dir in packages/*/; do
              node -p "const p=require('./${dir}package.json'); '- \`' + p.name + '@' + p.version + '\`'"
            done
            echo
            if [ -z "$PREV" ]; then
              echo "First tag — every artifact is new."
            elif [ -z "$ARTIFACTS" ]; then
              echo "**No non-npm artifact changed since \`$PREV\`.** If you consume"
              echo "\`configs/golangci.yml\`, \`practices/\` or \`principles/\`, this tag is"
              echo "provenance-only: re-pinning changes which tag you name, not what you enforce."
            else
              echo "**Changed since \`$PREV\`**, for consumers that fetch files rather than packages:"
              echo
              echo "$ARTIFACTS" | sed 's/^/- `/; s/$/`/'
            fi
            echo
            echo "Go consumers fetch \`configs/golangci.yml\` at this tag."
            echo
            echo "Resolve the newest tag deterministically — a lexical sort puts \`v0.9.0\` above \`v0.11.0\`:"
            echo
            echo '```bash'
            echo "git ls-remote --tags --refs https://github.com/${GITHUB_REPOSITORY}.git \\"
            echo "  | sed 's:.*refs/tags/::' | grep '^v' | sort -V | tail -1"
            echo '```'
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --latest
          fi
